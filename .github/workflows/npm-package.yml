name: Suite npm Packages

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - ".github/workflows/npm-package.yml"
      - "package.json"
      - "suite/templates/**"
      - "suite/docs/**"
      - "suite/npm/kimibuilt-suite/**"
      - "suite/npm/lilly-suite/**"
      - "suite/scripts/build-release-bundle.mjs"
      - "suite/scripts/release-gate.mjs"
      - "suite/install-compose.sh"
      - "suite/install-compose.cmd"
      - "suite/scripts/uninstall-compose.mjs"
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - ".github/workflows/npm-package.yml"
      - "package.json"
      - "suite/templates/**"
      - "suite/docs/**"
      - "suite/npm/kimibuilt-suite/**"
      - "suite/npm/lilly-suite/**"
      - "suite/scripts/build-release-bundle.mjs"
      - "suite/scripts/release-gate.mjs"
      - "suite/install-compose.sh"
      - "suite/install-compose.cmd"
      - "suite/scripts/uninstall-compose.mjs"
  workflow_dispatch:
    inputs:
      publish:
        description: "Manual npm publish gate. Kept disabled by default; requires NPM_TOKEN."
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  validate-package:
    name: Validate and pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_dir: suite/npm/kimibuilt-suite
            package_name: kimibuilt-suite
            cli_name: kimibuilt-suite
          - package_dir: suite/npm/lilly-suite
            package_name: lilly-suite
            cli_name: lilly-suite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify package path
        run: |
          set -euo pipefail
          test -f "${{ matrix.package_dir }}/package.json" || {
            echo "::error::Missing ${{ matrix.package_dir }}/package.json."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build release bundle payloads
        run: node suite/scripts/build-release-bundle.mjs --skip-tar

      - name: Run release gate
        run: node suite/scripts/release-gate.mjs

      - name: Verify package identity
        run: |
          set -euo pipefail
          cd "${{ matrix.package_dir }}"

          actual_name="$(node -p "require('./package.json').name")"
          if [ "${actual_name}" != "${{ matrix.package_name }}" ]; then
            echo "::error::Expected package name ${{ matrix.package_name }}, found ${actual_name}."
            exit 1
          fi

          node -e "const pkg=require('./package.json'); const bin=pkg.bin && (typeof pkg.bin === 'string' ? pkg.bin : pkg.bin['${{ matrix.cli_name }}']); if (!bin) { throw new Error('package.json must expose the ${{ matrix.cli_name }} CLI in bin'); } console.log('cli-bin=' + bin);"

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd "${{ matrix.package_dir }}"
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run package checks
        run: |
          set -euo pipefail
          cd "${{ matrix.package_dir }}"
          npm run lint --if-present
          npm run check --if-present
          npm test --if-present
          npm run build --if-present

      - name: Pack dry run
        run: |
          set -euo pipefail
          cd "${{ matrix.package_dir }}"
          npm pack --dry-run

      - name: Pack tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/npm-pack"
          cd "${{ matrix.package_dir }}"

          tarball="$(npm pack --pack-destination "${RUNNER_TEMP}/npm-pack")"
          tarball_path="${RUNNER_TEMP}/npm-pack/${tarball}"
          test -f "${tarball_path}"

          echo "tarball=${tarball_path}" >> "${GITHUB_OUTPUT}"
          echo "tarball_name=${tarball}" >> "${GITHUB_OUTPUT}"

      - name: Install packed CLI into temp prefix
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/${{ matrix.package_name }}-prefix"
          npm install --global --prefix "${prefix}" "${{ steps.pack.outputs.tarball }}"

          bin_dir="${prefix}/bin"
          cli="${bin_dir}/${{ matrix.cli_name }}"
          test -x "${cli}" || {
            echo "::error::Installed CLI is missing or not executable: ${cli}"
            ls -la "${bin_dir}" || true
            exit 1
          }

          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Run CLI dry-run checks
        run: |
          set -euo pipefail
          "${{ matrix.cli_name }}" --help
          "${{ matrix.cli_name }}" help
          "${{ matrix.cli_name }}" install --dry-run \
            --install-root "${RUNNER_TEMP}/${{ matrix.package_name }}-install" \
            --state-root "${RUNNER_TEMP}/${{ matrix.package_name }}-state"

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}-npm-package-${{ github.sha }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish disabled by default
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          set -euo pipefail
          echo "::error::Publishing is intentionally not wired yet. Add NPM_TOKEN, npm provenance policy, and release tag rules before enabling this step."
          exit 1
