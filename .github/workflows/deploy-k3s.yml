name: Deploy to k3s

on:
  workflow_run:
    workflows: ["Build, Package, and Publish"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: kimibuilt-production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  KUBE_NAMESPACE: kimibuilt

jobs:
  deploy-to-k3s:
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    env:
      KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.34.0

      - name: Verify fresh master source
        run: |
          set -euo pipefail
          release_sha="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            release_sha="$(node -e 'const e=require(process.env.GITHUB_EVENT_PATH); process.stdout.write(e.workflow_run.head_sha)')"
          fi
          git fetch --prune origin master
          test "$(git rev-parse HEAD)" = "$release_sha"
          test "$(git rev-parse origin/master)" = "$release_sha"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Setup kubectl and kubeconfig
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kube"
          if printf '%s' "$KUBECONFIG_SECRET" | base64 -d > "$RUNNER_TEMP/kube/config" 2>/dev/null; then
            :
          else
            printf '%s' "$KUBECONFIG_SECRET" > "$RUNNER_TEMP/kube/config"
          fi
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
          kubectl config current-context

      - name: Verify stable router targets without mutation
        run: node scripts/remote-cli/verify-router-targets.cjs

      - name: Deploy and verify under one coordinated Lease
        run: |
          set -euo pipefail
          image_name="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          release_short="$(printf '%s' "$RELEASE_SHA" | cut -c1-12)"
          release_image="$REGISTRY/$image_name:sha-$(printf '%s' "$RELEASE_SHA" | cut -c1-7)"
          expected_image="$(kubectl get deployment/backend -n "$KUBE_NAMESPACE" -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}')"
          release_id="github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$release_short"
          export RELEASE_IMAGE="$release_image" RELEASE_ID="$release_id"

          node scripts/k3s-deployment-coordinator.js run \
            --expected-image "$expected_image" \
            --source-sha "$RELEASE_SHA" \
            --namespace "$KUBE_NAMESPACE" \
            --deployment backend \
            --container backend \
            -- bash -se <<'RELEASE_SCRIPT'
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/primary-async-runtime.yaml
          kubectl apply -f k8s/qdrant-deployment.yaml
          kubectl apply -f k8s/ollama-deployment.yaml
          sed -i "s|image: ghcr.io/.*|image: $RELEASE_IMAGE|" k8s/kokoro-tts-deployment.yaml
          kubectl apply -f k8s/kokoro-tts-deployment.yaml

          node scripts/k3s-deployment-coordinator.js deploy-release \
            --owner "$KIMIBUILT_RELEASE_OWNER" \
            --namespace "$KIMIBUILT_RELEASE_NAMESPACE" \
            --deployment "$KIMIBUILT_RELEASE_DEPLOYMENT" \
            --container "$KIMIBUILT_RELEASE_CONTAINER" \
            --expected-image "$KIMIBUILT_RELEASE_EXPECTED_IMAGE" \
            --source-sha "$KIMIBUILT_RELEASE_SOURCE_SHA" \
            --image "$RELEASE_IMAGE" \
            --image-pull-policy Always \
            --config-file k8s/configmap.yaml \
            --config-map kimibuilt-config \
            --frontend-config-file k8s/frontend-nginx-config.yaml \
            --release-id "$RELEASE_ID" \
            --rollout-timeout-seconds 600

          kubectl apply -f k8s/rancher-ingress.yaml
          kubectl rollout status deployment/valkey-async-runtime -n "$KUBE_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/kokoro-tts -n "$KUBE_NAMESPACE" --timeout=600s
          kubectl rollout status deployment/backend -n "$KUBE_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/frontend -n "$KUBE_NAMESPACE" --timeout=180s
          kubectl exec deployment/backend -n "$KUBE_NAMESPACE" -- sh -lc 'test "$KIMIBUILT_IMAGE_PROFILE" = media && command -v ffmpeg >/dev/null'
          kubectl exec deployment/kokoro-tts -n "$KUBE_NAMESPACE" -- node -e "require('sharp')"
          kubectl exec deployment/frontend -n "$KUBE_NAMESPACE" -- nginx -t
          kubectl exec deployment/frontend -n "$KUBE_NAMESPACE" -- wget -q -O - http://127.0.0.1/_local/health | grep -qx ok
          curl --fail --silent --show-error --location --max-time 20 "https://lilly.secdevsolutions.help/ready" >/dev/null
          RELEASE_SCRIPT

      - name: Record deployed provenance
        run: |
          set -euo pipefail
          kubectl get deployment backend frontend -n "$KUBE_NAMESPACE" -o wide
          kubectl get lease deployment-coordination -n "$KUBE_NAMESPACE" -o yaml 2>/dev/null || true
