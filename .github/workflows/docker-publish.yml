name: Build, Package, and Publish

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:gate

      - name: Package application bundle
        run: |
          mkdir -p dist
          tar -czf "dist/kimibuilt-${GITHUB_SHA}.tar.gz" \
            src \
            frontend \
            k8s \
            package.json \
            package-lock.json \
            Dockerfile \
            docker-compose.yml \
            README.md

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimibuilt-package-${{ github.sha }}
          path: dist/kimibuilt-${{ github.sha }}.tar.gz
          if-no-files-found: error

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        run: |
          image_name="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${image_name}" >> "$GITHUB_ENV"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build release bundle payload
        run: |
          image_tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep ':sha-' | head -n 1 || true)"
          if [ -z "${image_tag}" ]; then
            image_tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          fi
          npm run release:bundle -- --image "${image_tag}"

      - name: Upload release deliverables
        uses: actions/upload-artifact@v4
        with:
          name: kimibuilt-suite-release-${{ github.sha }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.sha256
            dist/release/*.manifest.json
          if-no-files-found: error

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: media
          build-args: |
            INSTALL_NPM_OPTIONAL=true
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
