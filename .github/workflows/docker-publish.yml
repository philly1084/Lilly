name: Build, Package, and Publish

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  package-and-publish:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      HF_TOKEN_CONFIGURED: ${{ secrets.HF_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify remote agent artifact handoff
        run: |
          node --check src/remote-cli/agent-handoff.js
          node --check src/remote-cli/agent-result-artifacts.js
          node --check src/agent-sdk/tools/categories/ssh/RemoteCliAgentTool.js
          node --check src/remote-cli/agents-sdk-runner.js
          node --check src/conversation-orchestrator.js
          node --check src/artifacts/artifact-quality-gate.js
          node --check src/pii/pii-rehydrator.js
          node --check src/routes/artifacts.js
          node --check src/routes/managed-apps.js
          node --check src/routes/integrations-gitlab.js
          node --check src/async-lab/service.js
          node --check src/managed-apps/kubernetes-client.js
          node --check src/managed-apps/scaffold.js
          node --check src/managed-apps/service.js
          node --check scripts/canary-remote-agent-artifact-loop.js
          node --check scripts/canary-sandbox-agent-attach.js
          node --check frontend/shared/remote-artifact-workflow.js
          node --check frontend/web-cli/js/api.js
          node --check frontend/web-cli/js/app.js
          node --check frontend/canvas-excalidraw/js/api.js
          node --check frontend/canvas-excalidraw/js/app.js
          node --check frontend/notes-notion/js/agent.js
          node --check frontend/web-chat/js/artifacts.js
          node --check frontend/web-chat/js/api.js
          node --check frontend/web-chat/js/app.js
          npm test -- --runInBand --coverage=false --runTestsByPath \
            bin/kimibuilt-ui-check.test.js \
            src/remote-cli/agent-handoff.test.js \
            src/remote-cli/agent-result-artifacts.test.js \
            src/agent-sdk/tools/categories/ssh/RemoteCliAgentTool.test.js \
            src/remote-cli/agents-sdk-runner.test.js \
            src/artifacts/artifact-quality-gate.test.js \
            src/pii/__tests__/pii-rehydrator.test.js \
            src/routes/artifacts.test.js \
            src/routes/managed-apps.test.js \
            src/routes/integrations-gitlab.test.js \
            src/async-lab/service.test.js \
            src/routes/async-lab.test.js \
            src/managed-apps/kubernetes-client.test.js \
            src/managed-apps/scaffold.test.js \
            src/managed-apps/service.test.js \
            scripts/canary-remote-agent-artifact-loop.test.js \
            scripts/canary-sandbox-agent-attach.test.js \
            frontend/shared/remote-artifact-workflow.test.js \
            frontend/cli/lib/api.test.js \
            frontend/cli/lib/remote-agent.test.js \
            frontend/web-cli/js/api.test.js \
            frontend/web-cli/js/app-copy.test.js \
            frontend/web-cli/js/app-remote-artifact-workflow.test.js \
            frontend/web-cli/js/app-tool-form.test.js \
            frontend/canvas-excalidraw/js/api.test.js \
            frontend/notes-notion/js/agent.parse.test.js \
            frontend/web-chat/index.test.js \
            frontend/web-chat/js/artifacts-pdf-preview.test.js \
            frontend/web-chat/js/api.test.js \
            frontend/web-chat/js/app-remote-cli-agent.test.js \
            frontend/web-chat/js/ui-proof-pack.test.js
          node scripts/canary-remote-agent-artifact-loop.js --mode all
          node scripts/canary-sandbox-agent-attach.js --mode all
          npm test -- --runInBand --coverage=false --runTestsByPath \
            src/conversation-orchestrator.test.js \
            --testNamePattern='routes explicit assisted remote CLI authoring requests to remote-cli-agent instead of the end-to-end workflow'

      - name: Run release gate
        run: npm run release:gate

      - name: Package application bundle
        run: |
          mkdir -p dist
          tar -czf "dist/kimibuilt-${GITHUB_SHA}.tar.gz" \
            src \
            frontend \
            k8s \
            bin/kimibuilt-ui-check.js \
            scripts/canary-remote-agent-artifact-loop.js \
            scripts/canary-sandbox-agent-attach.js \
            docs/remote-agent-artifact-handoff.md \
            package.json \
            package-lock.json \
            Dockerfile \
            docker-compose.yml \
            README.md

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimibuilt-package-${{ github.sha }}
          path: dist/kimibuilt-${{ github.sha }}.tar.gz
          if-no-files-found: error

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        run: |
          image_name="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${image_name}" >> "$GITHUB_ENV"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build release bundle payload
        run: |
          image_tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep ':sha-' | head -n 1 || true)"
          if [ -z "${image_tag}" ]; then
            image_tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          fi
          npm run release:bundle -- --image "${image_tag}"

      - name: Upload release deliverables
        uses: actions/upload-artifact@v4
        with:
          name: kimibuilt-suite-release-${{ github.sha }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.sha256
            dist/release/*.manifest.json
          if-no-files-found: error

      - name: Build and push Docker image
        if: ${{ env.HF_TOKEN_CONFIGURED != 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target: media
          build-args: |
            INSTALL_NPM_OPTIONAL=true
            KIMIBUILT_SOURCE_REV=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image with Hugging Face token
        if: ${{ env.HF_TOKEN_CONFIGURED == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target: media
          build-args: |
            INSTALL_NPM_OPTIONAL=true
            KIMIBUILT_SOURCE_REV=${{ github.sha }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
