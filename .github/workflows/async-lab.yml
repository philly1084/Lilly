name: Async Lab Adjacent Build

on:
  push:
    branches:
      - codex/valkey-async-runtime-lab
  pull_request:
    branches:
      - master
      - main
    paths:
      - .github/workflows/async-lab.yml
      - Dockerfile
      - docker-compose.async.yml
      - docker-compose.yml
      - docs/async-runtime-primary-sidecar.md
      - frontend/agent-dashboard/**
      - frontend/async-lab/**
      - k8s/configmap.yaml
      - k8s/async-lab/**
      - k8s/primary-async-runtime.yaml
      - package.json
      - package-lock.json
      - src/async-lab/**
      - src/config.js
      - src/routes/admin/settings.controller.js
      - src/routes/admin/settings.controller.test.js
      - src/routes/async-lab*.js
      - src/server.js
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish ghcr async-lab image tag
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  async-lab:
    name: Validate async lab runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check async lab files
        run: |
          node --check src/async-lab/service.js
          node --check src/async-lab/store.js
          node --check src/async-lab/valkey-live-bus.js
          node --check src/config.js
          node --check src/routes/admin/settings.controller.js
          node --check src/routes/async-lab.js
          node --check src/routes/async-lab-webhooks.js
          node --check src/server.js
          node --check frontend/agent-dashboard/js/dashboard.js
          node --check frontend/async-lab/app.js

      - name: Run async lab unit and route tests
        run: npm run test:async-lab

      - name: Run Valkey live bus integration test
        env:
          ASYNC_VALKEY_TEST_URL: redis://127.0.0.1:6379/0
        run: npm run test:async-lab:valkey

      - name: Validate adjacent compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.async.yml config --services

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        run: |
          image_name="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${image_name}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image == 'true') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract async lab image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=async-lab
            type=sha,prefix=async-lab-sha-

      - name: Build async lab lite image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: lite
          build-args: |
            INSTALL_NPM_OPTIONAL=true
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image == 'true') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=async-lab-lite
          cache-to: type=gha,mode=max,scope=async-lab-lite
