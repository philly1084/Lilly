apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-async-runtime-data
  namespace: kimibuilt
  labels:
    app.kubernetes.io/name: kimibuilt
    app.kubernetes.io/component: valkey-async-runtime
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-async-runtime
  namespace: kimibuilt
  labels:
    app.kubernetes.io/name: kimibuilt
    app.kubernetes.io/component: valkey-async-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kimibuilt
      app.kubernetes.io/component: valkey-async-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kimibuilt
        app.kubernetes.io/component: valkey-async-runtime
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine
          imagePullPolicy: IfNotPresent
          args:
            - valkey-server
            - --appendonly
            - "yes"
            - --dir
            - /data
            - --save
            - "60"
            - "1000"
            - --maxmemory-policy
            - noeviction
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: valkey-data
              mountPath: /data
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: valkey-async-runtime-data
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-async-runtime
  namespace: kimibuilt
  labels:
    app.kubernetes.io/name: kimibuilt
    app.kubernetes.io/component: valkey-async-runtime
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
  selector:
    app.kubernetes.io/name: kimibuilt
    app.kubernetes.io/component: valkey-async-runtime
