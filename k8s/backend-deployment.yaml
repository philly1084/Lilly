apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kimibuilt
  labels:
    app: backend
  annotations:
    kimibuilt.secdevsolutions.help/scaling: "Single replica by design: uses shared backend-state PVC and Recreate strategy. See k8s/scaling-plan.md."
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: backend
          image: ghcr.io/philly1084/kimibuilt:sha-e5e1669
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: kimibuilt-config
            - secretRef:
                name: kimibuilt-secrets
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=4096"
            - name: UV_THREADPOOL_SIZE
              value: "16"
            - name: OPENAI_IMAGE_BATCH_CONCURRENCY
              value: "5"
            - name: PODCAST_TTS_CONCURRENCY
              value: "2"
            - name: TTS_REALTIME_SYNTHESIS_LANES
              value: "4"
            - name: TTS_REALTIME_SYNTHESIS_LOOKAHEAD
              value: "6"
          volumeMounts:
            - name: backend-state
              mountPath: /home/kimibuilt/.kimibuilt
            - name: kimibuilt-workspace
              mountPath: /opt/kimibuilt
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /live
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "6Gi"
              cpu: "4000m"
      volumes:
        - name: backend-state
          persistentVolumeClaim:
            claimName: backend-state
        - name: kimibuilt-workspace
          hostPath:
            path: /opt/kimibuilt
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kimibuilt
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
