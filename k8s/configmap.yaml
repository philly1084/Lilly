apiVersion: v1
kind: ConfigMap
metadata:
  name: kimibuilt-config
  namespace: kimibuilt
data:
  API_BASE_URL: "https://lilly.secdevsolutions.help"
  # Security hardening: keep auth required in production and only allow browser API calls from the canonical Lilly public origin.
  KIMIBUILT_AUTH_REQUIRED: "true"
  KIMIBUILT_ALLOWED_ORIGINS: "https://lilly.secdevsolutions.help,https://168.119.176.121,http://168.119.176.121"
  KIMIBUILT_ALLOW_QUERY_TOKENS: "false"
  KIMIBUILT_RATE_LIMIT_WINDOW_MS: "60000"
  KIMIBUILT_RATE_LIMIT_MAX: "120"
  KIMIBUILT_LOGIN_RATE_LIMIT_MAX: "10"
  KIMIBUILT_TOOL_RATE_LIMIT_MAX: "30"
  # Chat/tool traffic and frontend image generation stay on the internal OpenAI-compatible gateway.
  OPENAI_BASE_URL: "http://n8n-openai-cli-gateway.n8n-openai-gateway.svc.cluster.local/v1"
  OPENAI_MODEL: "kimi-for-coding"
  # Image-backed workflows can legitimately spend several minutes in the gateway before the final chat step.
  OPENAI_REQUEST_TIMEOUT_MS: "900000"
  OPENAI_TOOL_REQUEST_TIMEOUT_MS: "900000"
  OPENAI_IMAGE_MODEL: "gpt-image-2"
  # Server-side Agents SDK MCP connection for remote CLI coding agents.
  REMOTE_CLI_MCP_URL: "http://n8n-openai-cli-gateway.n8n-openai-gateway.svc.cluster.local/mcp"
  REMOTE_CLI_MCP_NAME: "remote-cli"
  REMOTE_CLI_DEFAULT_TARGET_ID: "k3s-prod"
  REMOTE_CLI_DEFAULT_CWD: "/srv/apps/my-app"
  REMOTE_CLI_AGENT_MODEL: "gpt-5.5"
  REMOTE_CLI_AGENT_OPENAI_API_MODE: "chat"
  REMOTE_CLI_AGENT_MAX_TURNS: "20"
  # Leave empty to use the gateway target's supported default model.
  REMOTE_CLI_REMOTE_CODE_MODEL: ""
  REMOTE_CLI_AGENT_MAX_STATUS_POLLS: "90"
  REMOTE_CLI_AGENT_STATUS_POLL_INTERVAL_MS: "2000"

  # The official OpenAI media endpoint remains available for video generation and image fallback.
  OPENAI_MEDIA_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MEDIA_IMAGE_MODEL: "gpt-image-2"
  OPENAI_MEDIA_VIDEO_MODEL: "sora-2"
  TTS_PROVIDER: "kokoro"
  TTS_FALLBACK_PROVIDER: "none"
  TTS_FALLBACK_ENABLED: "false"
  TTS_REALTIME_SYNTHESIS_LANES: "4"
  TTS_REALTIME_SYNTHESIS_LOOKAHEAD: "6"
  TTS_REALTIME_CHUNK_TARGET_CHARS: "360"
  TTS_REALTIME_INITIAL_BUFFER_CHUNKS: "1"
  TTS_REALTIME_INITIAL_BUFFER_SECONDS: "2.2"
  TTS_REALTIME_INITIAL_BUFFER_MAX_WAIT_MS: "650"
  TTS_REALTIME_FIRST_CHUNK_SENTENCES: "1"
  TTS_REALTIME_SECOND_CHUNK_SENTENCES: "1"
  TTS_REALTIME_MAX_SENTENCES_PER_CHUNK: "3"
  TTS_REALTIME_PRIMARY_TIMEOUT_MS: "24000"
  TTS_REALTIME_FALLBACK_TIMEOUT_MS: "24000"
  TTS_REALTIME_HEDGE_DELAY_MS: "900"
  TTS_REALTIME_CHUNK_STALL_MS: "9000"
  TTS_REALTIME_CHUNK_PAUSE_SECONDS: "0.08"
  TTS_REALTIME_TRIM_EDGE_SECONDS: "0.12"
  TTS_REALTIME_TRIM_THRESHOLD: "0.0035"
  TTS_REALTIME_SKIP_STALLED_CHUNKS: "false"
  TTS_REALTIME_EMERGENCY_PROVIDER: "kokoro"
  KOKORO_TTS_ENABLED: "true"
  KOKORO_TTS_MODEL_ID: "onnx-community/Kokoro-82M-v1.0-ONNX"
  KOKORO_TTS_BASE_URL: "http://kokoro-tts:3001"
  KOKORO_TTS_DEVICE: "cpu"
  KOKORO_TTS_DTYPE: "q8"
  KOKORO_TTS_CACHE_DIR: "/app/data/kokoro/cache"
  KOKORO_TTS_ALLOW_REMOTE_MODELS: "false"
  KOKORO_TTS_PORT: "3001"
  KOKORO_TTS_VOICES_PATH: "/app/data/kokoro/voices/manifest.json"
  KOKORO_TTS_DEFAULT_VOICE_ID: "af_heart"
  KOKORO_TTS_TIMEOUT_MS: "120000"
  KOKORO_G2P_ENABLED: "true"
  KOKORO_G2P_REQUIRED: "true"
  KOKORO_G2P_COMMAND: "/opt/kimibuilt-g2p/bin/python"
  KOKORO_G2P_SCRIPT_PATH: "/app/scripts/kokoro_g2p_bridge.py"
  KOKORO_G2P_TIMEOUT_MS: "15000"
  KOKORO_TTS_PODCAST_TIMEOUT_MS: "300000"
  KOKORO_TTS_PODCAST_CHUNK_CHARS: "700"
  KOKORO_TTS_SYNTHESIS_CONCURRENCY: "1"
  KOKORO_TTS_WORKER_ISOLATION: "process"
  KOKORO_TTS_HTTP_RETRY_ATTEMPTS: "2"
  KOKORO_TTS_HTTP_RETRY_DELAY_MS: "160"
  KOKORO_TTS_HTTP_CONNECTION_CLOSE: "true"
  PODCAST_TTS_CONCURRENCY: "2"
  AUDIO_PROCESSING_TIMEOUT_MS: "900000"
  PODCAST_MASTERING_ENABLED: "false"
  PODCAST_TOOL_TIMEOUT_MS: "3600000"
  PODCAST_VIDEO_SEGMENT_TIMEOUT_MS: "360000"
  PODCAST_VIDEO_MUX_TIMEOUT_MS: "1200000"
  PODCAST_VIDEO_MAX_FFMPEG_TIMEOUT_MS: "2700000"
  PODCAST_VIDEO_RENDER_MODE: "storyboard"
  PODCAST_VIDEO_DEFAULT_SCENE_COUNT: "14"
  PODCAST_VIDEO_GENERATED_IMAGE_RATIO: "4"
  PODCAST_VIDEO_AUDIO_REPAIR_ENABLED: "false"
  PODCAST_VIDEO_X264_PRESET: "veryfast"
  PODCAST_VIDEO_X264_CRF: "23"

  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_EMBED_MODEL: "nomic-embed-text:latest"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "conversations"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "kimibuilt"
  POSTGRES_USER: "kimibuilt"
  ARTIFACT_BROWSER_PATH: "/usr/bin/chromium"
  ARTIFACT_PDF_TIMEOUT_MS: "15000"
  KIMIBUILT_DEPLOY_REPO_URL: "https://github.com/philly1084/KimiBuilt.git"
  KIMIBUILT_DEPLOY_TARGET_DIR: "/opt/kimibuilt"
  KIMIBUILT_DEPLOY_MANIFESTS_PATH: "k8s"
  KIMIBUILT_DEPLOY_NAMESPACE: "kimibuilt"
  KIMIBUILT_DEPLOY_DEPLOYMENT: "backend"
  KIMIBUILT_DEPLOY_CONTAINER: "backend"
  KIMIBUILT_DEPLOY_BRANCH: "master"
  KIMIBUILT_GIT_COMMIT_NAME: "KimiBuilt Agent"
  KIMIBUILT_GIT_COMMIT_EMAIL: "kimibuilt-agent@local.invalid"
  KIMIBUILT_REMOTE_RUNNER_ENABLED: "true"
  KIMIBUILT_REMOTE_RUNNER_PREFERRED: "true"
  KIMIBUILT_DATA_DIR: "/home/kimibuilt/.kimibuilt"
  KIMIBUILT_STATE_DIR: "/home/kimibuilt/.kimibuilt"
  KUBERNETES_IN_CLUSTER_ENABLED: "true"
  GITEA_ENABLED: "false"
  GITLAB_ENABLED: "true"
  GITLAB_BASE_URL: "https://gitlab.demoserver2.buzz"
  GITLAB_GROUP: "agent-apps"
  GITLAB_REGISTRY_HOST: "registry.gitlab.demoserver2.buzz"
  MANAGED_APPS_ENABLED: "true"
  MANAGED_APPS_BASE_DOMAIN: "demoserver2.buzz"
  MANAGED_APPS_NAMESPACE_PREFIX: "app-"
  MANAGED_APPS_PLATFORM_NAMESPACE: "agent-platform"
  MANAGED_APPS_DEFAULT_BRANCH: "main"
  MANAGED_APPS_DEFAULT_CONTAINER_PORT: "80"
  MANAGED_APPS_REGISTRY_PULL_SECRET: "gitlab-registry-credentials"
  MANAGED_APPS_BUILD_EVENTS_PATH: "/api/integrations/gitlab/build-events"
  MANAGED_APPS_DEPLOY_TARGET: "runner"
  OPENCODE_ENABLED: "false"
  PORT: "3000"
  NODE_ENV: "production"
