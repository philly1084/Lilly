services:
  backend:
    image: ${KIMIBUILT_IMAGE}
    container_name: kimibuilt-suite-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - release.env
    environment:
      API_BASE_URL: ${KIMIBUILT_PUBLIC_ORIGIN:-http://localhost:3000}
      KIMIBUILT_ALLOWED_ORIGINS: ${KIMIBUILT_ALLOWED_ORIGINS:-http://localhost:3000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      DOCKER_HOST: tcp://docker-proxy:2375
      KIMIBUILT_DATA_DIR: /home/kimibuilt/.kimibuilt
      KIMIBUILT_STATE_DIR: /home/kimibuilt/.kimibuilt
    volumes:
      - ${KIMIBUILT_STATE_ROOT:-/var/lib/kimibuilt-suite}/backend:/home/kimibuilt/.kimibuilt
    depends_on:
      docker-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      com.kimibuilt.package: kimibuilt-suite
      com.kimibuilt.role: backend

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: kimibuilt-suite-docker-proxy
    restart: unless-stopped
    environment:
      AUTH: "1"
      CONTAINERS: "1"
      EXEC: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      POST: "1"
      VERSION: "1"
      VOLUMES: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      com.kimibuilt.package: kimibuilt-suite
      com.kimibuilt.role: docker-proxy

  postgres:
    image: postgres:16
    container_name: kimibuilt-suite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kimibuilt}
      POSTGRES_USER: ${POSTGRES_USER:-kimibuilt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${KIMIBUILT_STATE_ROOT:-/var/lib/kimibuilt-suite}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kimibuilt} -d ${POSTGRES_DB:-kimibuilt}"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      com.kimibuilt.package: kimibuilt-suite
      com.kimibuilt.role: postgres

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kimibuilt-suite-qdrant
    restart: unless-stopped
    environment:
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "4"
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: "2"
      QDRANT__SERVICE__MAX_WORKERS: "4"
    volumes:
      - ${KIMIBUILT_STATE_ROOT:-/var/lib/kimibuilt-suite}/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      com.kimibuilt.package: kimibuilt-suite
      com.kimibuilt.role: qdrant

  ollama:
    image: ollama/ollama:latest
    container_name: kimibuilt-suite-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_QUEUE: "256"
    volumes:
      - ${KIMIBUILT_STATE_ROOT:-/var/lib/kimibuilt-suite}/ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        /bin/ollama pull "${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}" || true
        wait
    labels:
      com.kimibuilt.package: kimibuilt-suite
      com.kimibuilt.role: ollama
